<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffa42e",
                        "background-light": "#f8f7f5",
                        "background-dark": "#231a0f",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full max-w-md mx-auto flex-col bg-background-light dark:bg-background-dark overflow-x-hidden border-x border-primary/10">
<!-- TopAppBar -->
<header class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center cursor-pointer">
<span class="material-symbols-outlined text-3xl">close</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center">PalabraBox</h2>
<div class="flex w-12 items-center justify-end">
<p class="text-primary text-base font-bold leading-normal tracking-[0.015em] shrink-0 flex items-center gap-1">
<span class="material-symbols-outlined text-xl fill-current">favorite</span> 3
                </p>
</div>
</header>
<!-- Progress Bar Section -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between items-end">
<p class="text-slate-700 dark:text-slate-300 text-base font-medium leading-normal">Lección: Colores</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-bold leading-normal bg-primary/20 px-2 py-0.5 rounded">6/10</p>
</div>
<div class="rounded-full bg-primary/20 h-3 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary" style="width: 60%;"></div>
</div>
</div>
<!-- Question Title -->
<div class="px-4 pt-8 pb-4">
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-2xl font-bold leading-tight text-center">
                ¿Qué significa esta palabra?
            </h3>
<p class="text-slate-500 dark:text-slate-400 text-center text-sm mt-1">Escucha con atención y selecciona la opción correcta</p>
</div>
<!-- Audio Interaction Section -->
<div class="flex flex-col items-center justify-center py-12 px-4 flex-1">
<!-- Pulsing Speaker Visualizer -->
<div class="relative flex items-center justify-center">
<!-- Visual Pulsing Rings -->
<div class="absolute w-48 h-48 bg-primary/10 rounded-full scale-110"></div>
<div class="absolute w-40 h-40 bg-primary/20 rounded-full scale-105"></div>
<button class="relative flex size-32 cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all active:scale-95">
<span class="material-symbols-outlined text-6xl text-white">volume_up</span>
</button>
</div>
<div class="mt-8 flex items-center gap-2 text-primary font-bold animate-pulse">
<span class="material-symbols-outlined">graphic_eq</span>
<span>Reproduciendo audio...</span>
</div>
</div>
<!-- Options Grid (Boxy Style) -->
<div class="grid grid-cols-2 gap-4 p-4 mb-8">
<label class="group relative flex flex-col items-center justify-center rounded-xl border-2 border-primary/20 bg-white dark:bg-slate-800/50 p-6 cursor-pointer transition-all hover:border-primary/50 has-checked:border-primary has-checked:bg-primary/5">
<input class="sr-only" name="translation_option" type="radio"/>
<span class="text-lg font-bold text-slate-900 dark:text-slate-100">rojo</span>
<div class="absolute top-2 right-2 opacity-0 group-has-checked:opacity-100 text-primary">
<span class="material-symbols-outlined fill-current">check_circle</span>
</div>
</label>
<label class="group relative flex flex-col items-center justify-center rounded-xl border-2 border-primary/20 bg-white dark:bg-slate-800/50 p-6 cursor-pointer transition-all hover:border-primary/50 has-checked:border-primary has-checked:bg-primary/5">
<input class="sr-only" name="translation_option" type="radio"/>
<span class="text-lg font-bold text-slate-900 dark:text-slate-100">azul</span>
<div class="absolute top-2 right-2 opacity-0 group-has-checked:opacity-100 text-primary">
<span class="material-symbols-outlined fill-current">check_circle</span>
</div>
</label>
<label class="group relative flex flex-col items-center justify-center rounded-xl border-2 border-primary/20 bg-white dark:bg-slate-800/50 p-6 cursor-pointer transition-all hover:border-primary/50 has-checked:border-primary has-checked:bg-primary/5">
<input checked="" class="sr-only" name="translation_option" type="radio"/>
<span class="text-lg font-bold text-slate-900 dark:text-slate-100">verde</span>
<div class="absolute top-2 right-2 opacity-100 text-primary">
<span class="material-symbols-outlined fill-current">check_circle</span>
</div>
</label>
<label class="group relative flex flex-col items-center justify-center rounded-xl border-2 border-primary/20 bg-white dark:bg-slate-800/50 p-6 cursor-pointer transition-all hover:border-primary/50 has-checked:border-primary has-checked:bg-primary/5">
<input class="sr-only" name="translation_option" type="radio"/>
<span class="text-lg font-bold text-slate-900 dark:text-slate-100">amarillo</span>
<div class="absolute top-2 right-2 opacity-0 group-has-checked:opacity-100 text-primary">
<span class="material-symbols-outlined fill-current">check_circle</span>
</div>
</label>
</div>
<!-- Bottom Action -->
<div class="p-4 pt-0 mb-4">
<button class="w-full flex h-14 items-center justify-center rounded-xl bg-primary text-white text-lg font-bold shadow-md shadow-primary/20 active:translate-y-0.5 transition-transform">
                COMPROBAR
            </button>
</div>
</div>
</body></html>
