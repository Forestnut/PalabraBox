<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PalabraBox - Flashcards</title>
<!-- Tailwind CSS with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans (Theme) & Nunito (Requested) -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FFA42C',
            accent: '#04724D',
            background: '#F0F5F1',
            dark: '#080C08',
          },
          borderRadius: {
            'twelve': '12px',
          },
          fontFamily: {
            sans: ['Nunito', 'Plus Jakarta Sans', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Boxy texture effect for the flashcard */
    .boxy-card {
      background-color: #ffffff;
      border: 3px solid #080C08;
      box-shadow: 8px 8px 0px 0px #080C08;
      position: relative;
    }
    .boxy-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 10px;
      background: rgba(8, 12, 8, 0.05);
      border-bottom: 1px solid rgba(8, 12, 8, 0.1);
      border-radius: 9px 9px 0 0;
    }
    
    /* Neumorphic/Boxy button style */
    .btn-boxy {
      border: 2px solid #080C08;
      box-shadow: 4px 4px 0px 0px #080C08;
      transition: all 0.1s ease;
    }
    .btn-boxy:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px 0px #080C08;
    }
  </style>
</head>
<body class="bg-background text-dark font-sans min-h-screen flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="px-6 py-4 flex items-center justify-between bg-white/50 backdrop-blur-sm sticky top-0 z-10" data-purpose="navigation-header">
<button aria-label="Volver" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div class="text-center">
<h1 class="text-xs font-bold uppercase tracking-widest text-accent opacity-80">Colores · Inglés</h1>
<p class="font-extrabold text-lg">PalabraBox</p>
</div>
<button aria-label="Ajustes" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-black/5">
<svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</button>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-grow flex flex-col items-center justify-center px-6 py-8" data-purpose="flashcard-area">
<!-- Flashcard Container -->
<div class="w-full max-w-sm aspect-[3/4] boxy-card rounded-twelve flex flex-col items-center justify-between p-8 cursor-pointer active:scale-[0.98] transition-transform" data-purpose="flashcard-main" id="flashcard">
<!-- Top Speaker Icon -->
<div class="w-full flex justify-end">
<button class="p-3 bg-primary/10 rounded-full text-primary hover:bg-primary/20 transition-colors" data-purpose="audio-button">
<svg fill="none" height="28" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24" width="28" xmlns="http://www.w3.org/2000/svg"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
</button>
</div>
<!-- Main Word -->
<div class="text-center">
<span class="block text-accent font-bold text-sm mb-2 uppercase tracking-widest">Inglés</span>
<h2 class="text-6xl font-extrabold tracking-tight">house</h2>
</div>
<!-- Hint text -->
<div class="flex items-center gap-2 text-dark/40 font-semibold animate-pulse">
<svg fill="none" height="18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24" width="18" xmlns="http://www.w3.org/2000/svg"><path d="M20 20v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
<span class="text-sm">Toca para girar</span>
</div>
</div>
<!-- Navigation Controls -->
<div class="mt-12 flex items-center gap-8" data-purpose="card-navigation">
<button aria-label="Anterior" class="w-14 h-14 btn-boxy bg-white rounded-twelve flex items-center justify-center text-dark">
<svg fill="none" height="28" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24" width="28" xmlns="http://www.w3.org/2000/svg"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<div class="bg-dark text-white px-6 py-2 rounded-full font-bold text-lg">
        3 <span class="text-white/40 mx-1">/</span> 15
      </div>
<button aria-label="Siguiente" class="w-14 h-14 btn-boxy bg-white rounded-twelve flex items-center justify-center text-dark">
<svg fill="none" height="28" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24" width="28" xmlns="http://www.w3.org/2000/svg"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterAction -->
<footer class="p-6 pb-10" data-purpose="screen-footer">
<button class="w-full py-5 bg-primary btn-boxy rounded-twelve text-dark font-extrabold text-lg uppercase tracking-wider">
      Volver al Menú
    </button>
</footer>
<!-- END: FooterAction -->
<script data-purpose="interactive-elements">
    // Simple mock interaction for the card tap
    const card = document.getElementById('flashcard');
    card.addEventListener('click', () => {
      card.style.transform = 'scale(0.95)';
      setTimeout(() => {
        card.style.transform = 'scale(1)';
      }, 100);
    });
  </script>
</body></html>
